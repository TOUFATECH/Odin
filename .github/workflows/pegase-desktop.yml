# Pégase pour ordinateur (une application de l'OS, dossier applications/pegase/) : essais, puis installateurs Windows
# (.exe NSIS), Mac (.dmg) et Linux (.AppImage, .deb). Les installateurs sont dans les « artifacts » de l'exécution
# (onglet Actions de GitHub). Une étiquette « pegase-v1.2.3 » posée sur un commit de la branche odin-os les publie en plus
# dans une Release GitHub : c'est là que les Pégase installés trouvent leurs mises à jour (electron-updater).
# PAS de certificat de signature (payant, pas encore choisi) : Windows (SmartScreen) et Mac (Gatekeeper) affichent un
# avertissement à l'installation, et la mise à jour automatique sur Mac exige une app signée.
# Ce fichier vit sur la branche odin-os : le lancement à la main (workflow_dispatch) n'est proposé par GitHub que pour les
# fabrications présentes sur la branche par défaut ; on lance donc par un envoi (push) ou une étiquette.
name: Pégase ordinateur

on:
  push:
    branches: [odin-os]
    paths:
      - 'applications/pegase/**'
      - 'applications/pegase-plume/**'
      - 'applications/commun/**'
      - '.github/workflows/pegase-desktop.yml'
    tags:
      - 'pegase-v*'
  pull_request:
    branches: [odin-os]
    paths:
      - 'applications/pegase/**'
      - 'applications/pegase-plume/**'
      - 'applications/commun/**'
      - '.github/workflows/pegase-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pegase-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cible: --linux AppImage deb
          - os: windows-latest
            cible: --win nsis
          - os: macos-latest
            cible: --mac dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: applications/pegase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/pegase/package-lock.json
      - name: Fichiers partagés avec l'application Odin (copies à jour ?)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          node applications/commun/verifier.mjs
      - name: Dépendances de Pégase
        run: npm ci
      - name: Types
        run: npm run types
      - name: Construction (icônes des applis d'Odin, processus principal, interface)
        run: npm run build
      - name: L'application Odin (branche main), pour les essais qui lancent un vrai Odin
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: main
          path: odin
      - name: Dépendances de l'application Odin
        if: runner.os == 'Linux'
        working-directory: odin
        run: npm ci
      - name: Essais dans le vrai Pégase (Linux, écran virtuel)
        if: runner.os == 'Linux'
        env:
          ODIN_RACINE: ${{ github.workspace }}/odin
        run: |
          npm install --no-save playwright@1.63.0
          xvfb-run -a node --test --test-concurrency=1 test/navigateur.test.mjs test/protection.test.mjs test/organisation.test.mjs test/partage.test.mjs test/outils.test.mjs test/donnees.test.mjs test/securite/attaques.test.mjs
      - name: Installateurs
        run: npx electron-builder ${{ matrix.cible }} --publish ${{ startsWith(github.ref, 'refs/tags/pegase-v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Pégase-${{ runner.os }}
          path: |
            applications/pegase/paquets/*.exe
            applications/pegase/paquets/*.dmg
            applications/pegase/paquets/*.AppImage
            applications/pegase/paquets/*.deb
            applications/pegase/paquets/*.yml
          if-no-files-found: error
