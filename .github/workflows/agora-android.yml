# Agora pour Android (le store d'Odin sur le téléphone) : essais JVM de la logique pure (store, décisions, empreintes,
# client d'Odin), puis APK debug et release (non signée). Les APK sont dans les « artifacts » de l'exécution.
# Une application de l'OS (dossier applications/agora-android/, branche odin-os). Le lancement à la main (workflow_dispatch) n'est
# proposé par GitHub que pour les fabrications de la branche par défaut : on lance par un envoi (push) sur odin-os.
name: Agora Android

on:
  push:
    branches: [odin-os]
    paths:
      - 'applications/agora-android/**'
      - '.github/workflows/agora-android.yml'
  pull_request:
    branches: [odin-os]
    paths:
      - 'applications/agora-android/**'
      - '.github/workflows/agora-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: applications/agora-android
    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK Android (plateforme 37, outils 36)
        uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Gradle (cache, vérification du wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Essais JVM (store, décisions, empreinte vérifiée, client d'Odin)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: APK debug et release (non signée)
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Rapports des essais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-android-essais
          path: applications/agora-android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-android-apk
          path: |
            applications/agora-android/app/build/outputs/apk/debug/*.apk
            applications/agora-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
