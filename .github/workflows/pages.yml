# Publie le dossier site/ sur GitHub Pages à chaque modification.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Site
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/site/**', 'tools/build-site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-site.py
      # enablement : active GitHub Pages (source « GitHub Actions ») tout seul au premier passage.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
